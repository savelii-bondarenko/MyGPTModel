[project]
name = "mygptmodel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Savelii Bondarenko", email = "savabondarenko2016@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi==2025.7.14",
    "charset-normalizer==3.4.2",
    "colorama==0.4.6",
    "filelock==3.13.1",
    "fsspec==2024.6.1",
    "idna==3.10",
    "jinja2==3.1.4",
    "markupsafe==2.1.5",
    "mpmath==1.3.0",
    "networkx==3.3",
    "numpy==2.1.2",
    "pillow==11.0.0",
    "regex==2024.11.6",
    "requests==2.32.4",
    "setuptools==70.2.0",
    "sympy==1.13.3",
    "tiktoken==0.9.0",
    "torch==2.7.1+cu128",
    "torchaudio==2.7.1+cu128",
    "torchvision==0.22.1+cu128",
    "tqdm==4.67.1",
    "typing-extensions==4.12.2",
    "urllib3==2.5.0",
]

[project.scripts]
mygptmodel = "mygptmodel:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
